<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="staff.css" />
</head>

<body>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>Staff Login</h2>
            <p>Please log in to continue</p>

            <form id="loginForm">
                <input type="email" placeholder="Email" required>

                <div class="password-wrapper">
                    <input type="password" id="passwordInput" placeholder="Password" required>
                    <button type="button" class="toggle-password" id="togglePassword">
                        show
                    </button>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>
        </div>
    </div>


    <div class="top-bar">
        <div class="top-bar-inner">

            <header class="header">
                <div class="header-left">
                    <img src="../img/logo.png" width="60px" />
                    <div>
                        <h1 id="pageTitle">Staff Dashboard</h1>
                        <p id="pageSubtitle">Manage and track all incoming orders</p>
                    </div>
                </div>

                <div class="header-right">
                    <nav class="main-tabs">
                        <button class="main-tab active" data-view="orders">📋 Orders</button>
                        <button class="main-tab" data-view="menu">🍽 Menu</button>
                    </nav>
                </div>
            </header>

        </div>
    </div>

    <div id="ordersView">
        <div class="top-bar-sub">
            <div class="top-bar-inner sub-bar-inner">
                <nav class="tabs">
                    <button class="tab all active" data-status="all">All Orders (0)</button>
                    <button class="tab pending" data-status="pending">Pending (0)</button>
                    <button class="tab preparing" data-status="preparing">Preparing (0)</button>
                    <button class="tab ready" data-status="ready">Ready (0)</button>
                    <button class="tab delivered" data-status="delivered">Delivered (0)</button>
                </nav>
                <button class="btn btn-clear" id="clearAllBtn">🗑 Clear All</button>
            </div>
        </div>

        <main class="container">
            <div class="content">
                <div class="orders"></div>
            </div>
        </main>
    </div>

    <div id="menuView" style="display:none">
        <main class="container">
            <div class="menu-manager">

                <div class="menu-toolbar">
                    <div class="menu-toolbar-left">
                        <select id="menuCategoryFilter">
                            <option value="">All Categories</option>
                        </select>
                        <label class="toggle-inactive">
                            <input type="checkbox" id="showInactive"> Show inactive
                        </label>
                    </div>
                    <button class="btn btn-add" id="addMenuItemBtn">+ Add Item</button>
                </div>

                <div id="menuItemsGrid" class="menu-items-grid"></div>

            </div>
        </main>
    </div>

    <div class="modal-overlay" id="menuModal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Menu Item</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editItemId">

                <div class="form-row">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" id="itemName" placeholder="e.g. Margherita Pizza">
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <input type="text" id="itemCategory" placeholder="e.g. Pizza" list="categoryDatalist">
                        <datalist id="categoryDatalist"></datalist>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="itemDescription" rows="2" placeholder="Short description..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Price (€) *</label>
                        <input type="number" id="itemPrice" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Sort Order</label>
                        <input type="number" id="itemSortOrder" min="0" placeholder="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="itemImgUrl" placeholder="https://...">
                </div>

                <div class="form-group form-check">
                    <label>
                        <input type="checkbox" id="itemIsActive" checked>
                        Active (visible to customers)
                    </label>
                </div>

                <p class="form-error" id="formError"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn btn-save" id="modalSave">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="deleteModal" style="display:none">
        <div class="modal modal-small">
            <div class="modal-body" style="text-align:center; padding: 32px 24px;">
                <p style="font-size:16px; font-weight:500; margin-bottom:24px;">Delete this menu item?</p>
                <div style="display:flex; gap:12px; justify-content:center;">
                    <button class="btn btn-secondary" id="deleteCancelBtn">Cancel</button>
                    <button class="btn btn-danger" id="deleteConfirmBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="staff.js"></script>
</body>

</html>
