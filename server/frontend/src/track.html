<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Qrestiq – Track Your Order</title>
    <link rel="icon" type="image/png" href="/assets/img/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #faf6f2;
            --card: #ffffff;
            --primary: #0b2940;
            --primary-hover: #154161;
            --secondary: #7b8a98;
            --chip: #f1ede8;
            --border: rgba(123, 138, 152, 0.18);
            --success: #28a745;
            --danger: #ff4d4d;
            --spring-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
            --smooth-ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            overflow-x: hidden;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--primary);
            min-height: 100dvh;
            padding-bottom: 60px;
        }

        /* ── Header — identical to main app ─────────────────────────── */
        .main-header {
            background: var(--card);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 10px rgba(11, 41, 64, 0.05);
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: headerSlide 0.5s var(--spring-ease) both;
        }

        @keyframes headerSlide {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.3px;
            text-decoration: none;
            color: var(--primary);
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--secondary);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 20px;
            background: var(--chip);
            transition: background 0.2s, color 0.2s;
        }

        .back-btn:hover {
            background: #e2dcd5;
            color: var(--primary);
        }

        .back-btn svg {
            width: 14px;
            height: 14px;
        }

        /* ── Page layout ─────────────────────────────────────────────── */
        .page {
            max-width: 560px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        /* ── Search card ─────────────────────────────────────────────── */
        .search-card {
            background: var(--card);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 4px 16px rgba(11, 41, 64, 0.06);
            margin-bottom: 20px;
            animation: fadeUp 0.45s var(--spring-ease) both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--secondary);
            margin-bottom: 6px;
        }

        .search-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .search-subtitle {
            font-size: 13px;
            color: var(--secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        .search-row input {
            flex: 1;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--primary);
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s var(--spring-ease);
            min-width: 0;
        }

        .search-row input::placeholder {
            color: #b0bbc5;
            font-weight: 400;
        }

        .search-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(11, 41, 64, 0.08);
        }

        .search-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 22px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: background 0.2s, transform 0.15s var(--spring-ease), box-shadow 0.2s;
        }

        .search-btn svg {
            width: 15px;
            height: 15px;
        }

        .search-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(11, 41, 64, 0.2);
        }

        .search-btn:active {
            transform: scale(0.95);
        }

        .search-hint {
            margin-top: 12px;
            font-size: 12px;
            color: var(--secondary);
        }

        /* ── States ──────────────────────────────────────────────────── */
        #content {
            animation: fadeUp 0.4s var(--spring-ease) both 0.05s;
        }

        .state-empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--secondary);
        }

        .state-empty svg {
            width: 44px;
            height: 44px;
            margin: 0 auto 14px;
            display: block;
            opacity: 0.25;
        }

        .state-empty p {
            font-size: 14px;
            font-weight: 500;
        }

        .state-error {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid var(--danger);
            box-shadow: 0 4px 12px rgba(11, 41, 64, 0.05);
        }

        .state-error svg {
            display: block;
            margin: 0 auto 10px;
            width: 22px;
            height: 22px;
            color: var(--danger);
        }

        .state-error p {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            margin: 0;
        }

        .state-loading {
            text-align: center;
            padding: 50px 20px;
            color: var(--secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(11, 41, 64, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Order card ──────────────────────────────────────────────── */
        .order-card {
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(11, 41, 64, 0.06);
            overflow: hidden;
        }

        /* Card header */
        .order-card-header {
            padding: 22px 22px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .order-id-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--secondary);
            margin-bottom: 3px;
        }

        .order-id-num {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--primary);
        }

        .order-table-tag {
            background: var(--chip);
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .order-table-tag strong {
            color: var(--primary);
        }

        /* ── Status progress track ───────────────────────────────────── */
        .status-section {
            padding: 22px;
            border-bottom: 1px solid var(--border);
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--secondary);
            margin-bottom: 18px;
        }

        .status-track {
            display: flex;
            align-items: flex-start;
            position: relative;
        }

        .status-step {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        /* connector line between dots */
        .status-step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 14px;
            left: calc(50% + 14px);
            right: calc(-50% + 14px);
            height: 2px;
            background: var(--border);
            z-index: -1;
            transition: background 0.4s;
        }

        .status-step.done:not(:last-child)::after {
            background: var(--primary);
        }

        .status-step.active:not(:last-child)::after {
            background: var(--border);
        }

        .step-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.35s var(--spring-ease);
        }

        .step-dot svg {
            width: 13px;
            height: 13px;
            opacity: 0;
            transition: opacity 0.25s;
        }

        .status-step.done .step-dot {
            background: var(--primary);
            border-color: var(--primary);
        }

        .status-step.done .step-dot svg {
            opacity: 1;
            color: #fff;
        }

        .status-step.active .step-dot {
            border-color: var(--primary);
            background: var(--card);
            box-shadow: 0 0 0 4px rgba(11, 41, 64, 0.1);
            animation: dotPulse 2s ease-in-out infinite;
        }

        .status-step.active .step-dot svg {
            opacity: 1;
            color: var(--primary);
        }

        @keyframes dotPulse {

            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(11, 41, 64, 0.08);
            }

            50% {
                box-shadow: 0 0 0 7px rgba(11, 41, 64, 0.04);
            }
        }

        .step-name {
            font-size: 10px;
            font-weight: 600;
            color: rgba(123, 138, 152, 0.6);
            text-align: center;
            letter-spacing: 0.02em;
            line-height: 1.3;
            transition: color 0.3s;
        }

        .status-step.done .step-name {
            color: var(--secondary);
        }

        .status-step.active .step-name {
            color: var(--primary);
            font-weight: 700;
        }

        /* Status badge */
        .status-badge {
            margin-top: 18px;
            padding: 13px 16px;
            border-radius: 12px;
            display: flex;
            align-items: flex-start;
            gap: 11px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-badge svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .status-badge .badge-desc {
            font-size: 12px;
            font-weight: 400;
            color: inherit;
            opacity: 0.75;
            margin-top: 2px;
        }

        .badge-pending {
            background: #fff8ee;
            color: #c47d20;
        }

        .badge-confirmed {
            background: #eef4ff;
            color: #2663c7;
        }

        .badge-preparing {
            background: #fff8ee;
            color: #c47d20;
        }

        .badge-ready {
            background: #edfbf2;
            color: #1e8c3f;
        }

        .badge-completed {
            background: #edfbf2;
            color: #1e8c3f;
        }

        .badge-cancelled {
            background: #fff2f2;
            color: #c0392b;
        }

        /* ── Items section ───────────────────────────────────────────── */
        .items-section {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-qty {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--chip);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            flex-shrink: 0;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
        }

        .item-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--secondary);
            white-space: nowrap;
        }

        .note-box {
            margin-top: 14px;
            padding: 10px 14px;
            background: var(--bg);
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 13px;
            color: var(--secondary);
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .note-box svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* ── Total ───────────────────────────────────────────────────── */
        .total-section {
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .total-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .total-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        /* ── Timestamps ──────────────────────────────────────────────── */
        .time-section {
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
        }

        .time-item {
            text-align: center;
        }

        .time-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--secondary);
            margin-bottom: 2px;
        }

        .time-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        /* ── Refresh row ─────────────────────────────────────────────── */
        .refresh-row {
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .refresh-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--secondary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: background 0.2s, color 0.2s, transform 0.15s var(--spring-ease), box-shadow 0.2s;
            box-shadow: 0 2px 6px rgba(11, 41, 64, 0.04);
        }

        .refresh-btn svg {
            width: 14px;
            height: 14px;
            transition: transform 0.6s;
        }

        .refresh-btn:hover {
            background: var(--chip);
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(11, 41, 64, 0.08);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        .refresh-btn.spinning svg {
            animation: spin 0.7s linear infinite;
        }

        .auto-note {
            font-size: 11px;
            font-weight: 500;
            color: var(--secondary);
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <header class="main-header">
        <a href="/" class="brand">
            <img src="/assets/img/logo.png" alt="Qrestiq" class="brand-logo" onerror="this.style.display='none'" />
            <span>Qrestiq</span>
        </a>
        <a href="/" class="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Menu
        </a>
    </header>

    <div class="page">

        <!-- Search -->
        <div class="search-card">
            <p class="search-eyebrow">Order Tracking</p>
            <h1 class="search-title">Where's my order?</h1>
            <p class="search-subtitle">Enter your order number to see the current status.</p>

            <div class="search-row">
                <input type="number" id="orderIdInput" placeholder="Order number, e.g. 42" min="1" inputmode="numeric"
                    autocomplete="off" />
                <button class="search-btn" onclick="doSearch()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="M21 21l-4.35-4.35" />
                    </svg>
                    Track
                </button>
            </div>
            <p class="search-hint">Your order number was shown after you placed your order.</p>
        </div>

        <!-- Result -->
        <div id="content">
            <div class="state-empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <p>Your order status will appear here.</p>
            </div>
        </div>

    </div>

    <script>
        const API = '/api';

        // Auto-load from URL ?id=42
        document.addEventListener('DOMContentLoaded', () => {
            // Auto-load z URL, napr. ?id=42
            const urlId = new URLSearchParams(window.location.search).get('id');
            if (urlId) {
                document.getElementById('orderIdInput').value = urlId;
                doSearch(); // Hneď potvrdí a spustí vyhľadávanie
            }
        });

        document.getElementById('orderIdInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });

        let refreshTimer = null;

        async function doSearch() {
            const id = parseInt(document.getElementById('orderIdInput').value.trim(), 10);
            if (!id || id <= 0) {
                const input = document.getElementById('orderIdInput');
                input.focus();
                input.style.borderColor = 'var(--danger)';
                input.style.boxShadow = '0 0 0 4px rgba(255,77,77,0.1)';
                setTimeout(() => {
                    input.style.borderColor = '';
                    input.style.boxShadow = '';
                }, 1200);
                return;
            }
            const url = new URL(window.location.href);
            url.searchParams.set('id', id);
            window.history.replaceState({}, '', url);
            clearRefresh();
            await loadOrder(id);
        }

        async function loadOrder(id, silent = false) {
            if (!silent) showLoading();
            try {
                const res = await fetch(`${API}/orders/track/${id}`);
                if (res.status === 404) { showError(`Order #${id} not found. Please double-check your order number.`); return; }
                if (!res.ok) { showError('Something went wrong. Please try again.'); return; }
                const order = await res.json();
                renderOrder(order);
                if (['pending', 'confirmed', 'preparing', 'ready'].includes(order.status)) {
                    refreshTimer = setTimeout(() => loadOrder(id, true), 15000);
                }
            } catch {
                showError('Could not connect to the server. Please check your connection.');
            }
        }

        function clearRefresh() {
            if (refreshTimer) clearTimeout(refreshTimer);
            refreshTimer = null;
        }

        function showLoading() {
            document.getElementById('content').innerHTML = `
            <div class="state-loading">
                <div class="spinner"></div>
                Looking up your order…
            </div>`;
        }

        function showError(msg) {
            document.getElementById('content').innerHTML = `
            <div class="state-error">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <p>${esc(msg)}</p>
            </div>`;
        }

        // ── Status config ─────────────────────────────────────────────────────────

        const STEPS = [
            {
                key: 'pending', label: 'Received',
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>`
            },
            {
                key: 'confirmed', label: 'Confirmed',
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`
            },
            {
                key: 'preparing', label: 'Preparing',
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M4.93 7.93L3.5 6.5M2 12H6M4.93 16.07L3.5 17.5M12 22v-4M19.07 16.07L20.5 17.5M22 12h-4M19.07 7.93L20.5 6.5"/></svg>`
            },
            {
                key: 'ready', label: 'Ready',
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`
            },
            {
                key: 'completed', label: 'Done',
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>`
            },
        ];

        const META = {
            pending: { cls: 'badge-pending', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`, title: 'Waiting for confirmation', desc: 'Your order was received and is waiting to be confirmed by our staff.' },
            confirmed: { cls: 'badge-confirmed', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`, title: 'Order confirmed', desc: 'Great! Staff confirmed your order. The kitchen will start soon.' },
            preparing: { cls: 'badge-preparing', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M4.93 7.93L3.5 6.5M2 12H6M19.07 7.93L20.5 6.5M22 12h-4"/></svg>`, title: 'Being prepared in the kitchen', desc: 'Your food is on its way — should be ready soon!' },
            ready: { cls: 'badge-ready', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`, title: 'Ready to be served! 🎉', desc: 'Your order is ready and will be brought to your table shortly.' },
            completed: { cls: 'badge-completed', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>`, title: 'Order completed', desc: 'Your order has been served. Enjoy your meal!' },
            cancelled: { cls: 'badge-cancelled', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>`, title: 'Order cancelled', desc: 'This order has been cancelled. Please speak to staff if this is unexpected.' },
        };

        function stepState(stepKey, status) {
            if (status === 'cancelled') return 'idle';
            const keys = STEPS.map(s => s.key);
            const ci = keys.indexOf(status);
            const si = keys.indexOf(stepKey);
            if (si < 0) return 'idle';
            if (si < ci) return 'done';
            if (si === ci) return 'active';
            return 'idle';
        }

        function renderOrder(order) {
            const meta = META[order.status] || META.pending;
            const isCancelled = order.status === 'cancelled';

            const stepsHTML = STEPS.map(s => {
                const state = stepState(s.key, order.status);
                return `<div class="status-step ${state}">
                <div class="step-dot">${s.icon}</div>
                <div class="step-name">${s.label}</div>
            </div>`;
            }).join('');

            const itemsHTML = order.items.map(i => `
            <div class="item-row">
                <div class="item-left">
                    <div class="item-qty">${i.quantity}×</div>
                    <div class="item-name">${esc(i.name)}</div>
                </div>
                <div class="item-price">€${(i.price * i.quantity).toFixed(2)}</div>
            </div>`).join('');

            const noteHTML = order.note ? `
            <div class="note-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                ${esc(order.note)}
            </div>` : '';

            const isActive = ['pending', 'confirmed', 'preparing', 'ready'].includes(order.status);

            document.getElementById('content').innerHTML = `
            <div class="order-card">

                <div class="order-card-header">
                    <div>
                        <div class="order-id-label">Order Number</div>
                        <div class="order-id-num">#${order.id}</div>
                    </div>
                    <div class="order-table-tag">Table <strong>${order.tableNumber}</strong></div>
                </div>

                ${!isCancelled ? `
                <div class="status-section">
                    <div class="section-label">Order Progress</div>
                    <div class="status-track">${stepsHTML}</div>
                    <div class="status-badge ${meta.cls}">
                        ${meta.icon}
                        <div>
                            <div>${meta.title}</div>
                            <div class="badge-desc">${meta.desc}</div>
                        </div>
                    </div>
                </div>` : `
                <div class="status-section">
                    <div class="status-badge ${meta.cls}">
                        ${meta.icon}
                        <div>
                            <div>${meta.title}</div>
                            <div class="badge-desc">${meta.desc}</div>
                        </div>
                    </div>
                </div>`}

                <div class="items-section">
                    <div class="section-label">Items ordered</div>
                    ${itemsHTML}
                    ${noteHTML}
                </div>

                <div class="total-section">
                    <div class="total-label">Total</div>
                    <div class="total-value">€${parseFloat(order.total).toFixed(2)}</div>
                </div>

                <div class="time-section">
                    <div class="time-item">
                        <div class="time-label">Placed</div>
                        <div class="time-value">${fmtTime(order.createdAt)}</div>
                    </div>
                    <div class="time-item">
                        <div class="time-label">Last update</div>
                        <div class="time-value">${fmtTime(order.updatedAt)}</div>
                    </div>
                </div>

            </div>

            <div class="refresh-row">
                <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh(${order.id})">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                    </svg>
                    Refresh
                </button>
                ${isActive ? `<span class="auto-note">Auto-refreshes every 15s</span>` : ''}
            </div>
        `;
        }

        async function manualRefresh(id) {
            const btn = document.getElementById('refreshBtn');
            if (btn) btn.classList.add('spinning');
            clearRefresh();
            await loadOrder(id, true);
        }

        function fmtTime(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        }

        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    </script>

</body>

</html>
